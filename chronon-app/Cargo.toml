[package]
name = "chronon-app"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Leptos ops UI for Chronon jobs, runs, scripts, and dashboards under /chronon"
readme = "README.md"

[lints]
workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_config.workspace = true
leptos_dom.workspace = true
leptos_macro.workspace = true
leptos_server.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

icondata.workspace = true
icondata_core.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

orbital-data = { workspace = true }
orbital-charts = { workspace = true, default-features = false }

# CSS - Turf for compile-time SCSS compilation
turf.workspace = true

# Orbital components
orbital = { workspace = true, default-features = false }
orbital-motion = { workspace = true }
uf-integrations = { workspace = true, default-features = false }
lepton-shell = { workspace = true, default-features = false }
uf-help = { workspace = true, default-features = false }
uf-help-macros = { workspace = true }

# Orbital macros for app definition
orbital-macros = { workspace = true }
uf-product-macros = { workspace = true }
uf-product = { workspace = true, default-features = false, optional = true }
inventory = { workspace = true, optional = true }

# Pagination primitives (Page<T>, PageRequest)
orbital-paging = { workspace = true }

# Pure job/run/script contracts (no Leptos)
chronon-backend = { path = "../chronon-backend" }

# Chronon scheduler (SSR only)
chronon-coordinator = { workspace = true, optional = true }
valence = { workspace = true, optional = true }

# Higgs application context
higgs = { workspace = true, optional = true }
gauge = { workspace = true, optional = true }
lepton-auth = { workspace = true, optional = true }
leptos-use = { workspace = true, default-features = false, features = ["use_interval_fn"], optional = true }


[features]
default = []
# Lab-only email-verification override used by `chronon-uf-app-e2e` seeds.
# Production hosts leave this off.
e2e-lab = []
hydrate = [
    "leptos/hydrate",
    "orbital-motion/hydrate",
    "uf-integrations/hydrate",
    "uf-integrations/offering-help",
    "lepton-shell/hydrate",
    "orbital-paging/hydrate",
    "orbital-charts/hydrate",
    "dep:uf-product",
    "uf-product/hydrate",
    "uf-help/hydrate",
    "dep:leptos-use",
]
ssr = [
    "leptos/ssr", 
    "leptos_meta/ssr", 
    "leptos_router/ssr", 
    "dep:leptos_axum",
    "dep:axum",
    "orbital-motion/ssr",
    "orbital/ssr",
    "uf-integrations/ssr",
    "uf-integrations/offering-help",
    "lepton-shell/ssr",
    "dep:chronon-coordinator",
    "dep:valence",
    "valence/sqlite",
    "dep:higgs",
    "higgs/ssr",
    "higgs/chronon",
    "dep:gauge",
    "gauge/ssr",
    "dep:lepton-auth",
    "lepton-auth/ssr",
    "dep:uf-product",
    "uf-product/ssr",
    "uf-help/ssr",
    "orbital-paging/ssr",
    "orbital-charts/ssr",
    "dep:inventory",
]
